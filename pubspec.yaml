        }

        // Toast Message Utility
        function showToast(text) {
            const toast = document.getElementById('toast-msg');
            toast.textContent = text;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // Audio Chant Audio Simulation using Web Audio API (No External Media File dependence)
        let audioContext = null;
        let isPlayingAudio = false;

        function toggleChant() {
            const icon = document.getElementById('audio-icon');
            const text = document.getElementById('audio-text');

            if(!isPlayingAudio) {
                playChantBeep();
                icon.className = "fa-solid fa-volume-high text-caRed animate-pulse";
                text.textContent = "يعزف الأنشودة...";
                showToast("🔊 شعب الإفريقي يعزف أحلى الألحان!");
                isPlayingAudio = true;
            } else {
                icon.className = "fa-solid fa-music animate-bounce";
                text.textContent = "الأهازيج";
                isPlayingAudio = false;
            }
        }

        function playChantBeep() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            // Create a short rhythmic tone sequence for celebration vibe
            const notes = [261.63, 329.63, 392.00, 523.25];
            notes.forEach((freq, idx) => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioContext.currentTime + idx * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + idx * 0.15 + 0.3);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start(audioContext.currentTime + idx * 0.15);
                osc.stop(audioContext.currentTime + idx * 0.15 + 0.3);
            });
        }

        // Helper to prevent HTML Injection
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // Countdown Timer Implementation
        function updateCountdown() {
            const daysEl = document.getElementById('cd-days');
            const hoursEl = document.getElementById('cd-hours');
            const minutesEl = document.getElementById('cd-minutes');
            const secondsEl = document.getElementById('cd-seconds');

            let sec = parseInt(secondsEl.textContent);
            if (sec > 0) {
                secondsEl.textContent = String(sec - 1).padStart(2, '0');
            } else {
                secondsEl.textContent = "59";
            }
        }
        setInterval(updateCountdown, 1000);
    </script>
