            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            // Show selected section
            document.getElementById(`section-${tabId}`).classList.remove('hidden');

            // Reset Desktop styles
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-caRed', 'bg-caRed/10');
                btn.classList.add('hover:text-caRed', 'hover:bg-caRed/10');
            });
            const activeDesktopBtn = document.getElementById(`tab-btn-${tabId}`);
            if(activeDesktopBtn) {
                activeDesktopBtn.classList.add('text-caRed', 'bg-caRed/10');
            }

            // Reset Mobile buttons
            document.querySelectorAll('[id^="mob-btn-"]').forEach(btn => {
                btn.classList.remove('text-caRed');
                btn.classList.add('text-gray-500', 'dark:text-gray-400');
            });
            const activeMobBtn = document.getElementById(`mob-btn-${tabId}`);
            if(activeMobBtn) {
                activeMobBtn.classList.remove('text-gray-500', 'dark:text-gray-400');
                activeMobBtn.classList.add('text-caRed');
            }
        }

        // News Filter Logic
        function filterNews(category) {
            // Update filter buttons appearance
            document.querySelectorAll('.news-filter-btn').forEach(btn => {
                btn.classList.remove('bg-caRed', 'text-white');
                btn.classList.add('bg-gray-200', 'dark:bg-gray-800', 'text-gray-600', 'dark:text-gray-300');
            });
            event.target.classList.remove('bg-gray-200', 'dark:bg-gray-800', 'text-gray-600', 'dark:text-gray-300');
            event.target.classList.add('bg-caRed', 'text-white');

            // Filter cards
            const cards = document.querySelectorAll('.news-card');
            cards.forEach(card => {
                if (category === 'all' || card.classList.contains(category)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

